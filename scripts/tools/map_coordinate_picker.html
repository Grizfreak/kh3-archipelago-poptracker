<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Coordinate Picker</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #ddd; }
  #sidebar { width: 340px; flex: none; padding: 12px; box-sizing: border-box; overflow-y: auto; background: #252526; border-right: 1px solid #444; }
  #canvasWrap { flex: 1; overflow: auto; position: relative; background: #111; }
  canvas { cursor: crosshair; image-rendering: pixelated; display: block; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; font-size: 12px; margin: 8px 0 2px; color: #aaa; }
  input, select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 13px; background: #1e1e1e; color: #ddd; border: 1px solid #555; }
  button { margin-top: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #coordReadout { font-size: 18px; font-family: monospace; margin: 10px 0; padding: 8px; background: #111; border: 1px solid #444; }
  #points { list-style: none; padding: 0; margin-top: 10px; }
  #points li { font-family: monospace; font-size: 12px; padding: 4px; border-bottom: 1px solid #333; word-break: break-all; }
  #points li button { margin: 4px 4px 0 0; font-size: 11px; padding: 2px 6px; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
  #snippetOut { width: 100%; height: 90px; font-family: monospace; font-size: 11px; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>Map Coordinate Picker</h2>

  <label>Map image (from this pack's images/ folder)</label>
  <input type="file" id="fileInput" accept="image/*">
  <div class="hint">Drag &amp; drop an image onto the canvas also works.</div>

  <label>Zoom</label>
  <input type="range" id="zoom" min="0.25" max="4" step="0.05" value="1">
  <div class="hint"><span id="zoomLabel">100%</span> &mdash; image is shown at native pixel size at 100%, matching the x/y units used in the pack's JSON.</div>

  <div id="coordReadout">x: -, y: -</div>

  <label>"map" name for snippet</label>
  <input type="text" id="mapName" placeholder="map_olympus_mount_olympus_p1">

  <label>"shape" for snippet</label>
  <select id="shape">
    <option>diamond</option>
    <option>rect</option>
    <option>star</option>
  </select>

  <button id="clearBtn">Clear points</button>

  <ul id="points"></ul>

  <label>Snippet (all points)</label>
  <textarea id="snippetOut" readonly></textarea>
  <button id="copyBtn">Copy snippet to clipboard</button>
</div>
<div id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const zoomInput = document.getElementById('zoom');
const zoomLabel = document.getElementById('zoomLabel');
const coordReadout = document.getElementById('coordReadout');
const mapNameInput = document.getElementById('mapName');
const shapeInput = document.getElementById('shape');
const pointsList = document.getElementById('points');
const snippetOut = document.getElementById('snippetOut');

let img = null;
let zoom = 1;
let points = [];

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    img = image;
    mapNameInput.value = guessMapName(file.name);
    draw();
  };
  image.src = url;
}

function guessMapName(filename) {
  const base = filename.replace(/\.[^.]+$/, '');
  return 'map_' + base.replace(/^map[_-]?/i, '');
}

function draw() {
  if (!img) return;
  canvas.width = img.width * zoom;
  canvas.height = img.height * zoom;
  ctx.imageSmoothingEnabled = zoom < 1;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  for (const p of points) {
    drawMarker(p.x * zoom, p.y * zoom);
  }
}

function drawMarker(cx, cy) {
  ctx.save();
  ctx.strokeStyle = '#ff3355';
  ctx.fillStyle = '#ff3355';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy);
  ctx.lineTo(cx + 8, cy);
  ctx.moveTo(cx, cy - 8);
  ctx.lineTo(cx, cy + 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

wrap.addEventListener('dragover', (e) => e.preventDefault());
wrap.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

zoomInput.addEventListener('input', () => {
  zoom = parseFloat(zoomInput.value);
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
  draw();
});

canvas.addEventListener('mousemove', (e) => {
  if (!img) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / zoom);
  const y = Math.round((e.clientY - rect.top) / zoom);
  coordReadout.textContent = `x: ${x}, y: ${y}`;
});

canvas.addEventListener('click', (e) => {
  if (!img) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / zoom);
  const y = Math.round((e.clientY - rect.top) / zoom);
  points.push({ x, y });
  renderPoints();
  draw();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  points = [];
  renderPoints();
  draw();
});

function renderPoints() {
  pointsList.innerHTML = '';
  points.forEach((p, i) => {
    const li = document.createElement('li');
    li.textContent = `#${i + 1}  x: ${p.x}, y: ${p.y}  `;
    const del = document.createElement('button');
    del.textContent = 'x';
    del.addEventListener('click', () => {
      points.splice(i, 1);
      renderPoints();
      draw();
    });
    li.appendChild(del);
    pointsList.appendChild(li);
  });
  updateSnippet();
}

function updateSnippet() {
  const mapName = mapNameInput.value || 'map_name_here';
  const shape = shapeInput.value;
  const snippets = points.map(p =>
`        "map_locations": [
          {
            "map": "${mapName}",
            "x": ${p.x},
            "y": ${p.y},
            "shape": "${shape}"
          }
        ]`);
  snippetOut.value = snippets.join(',\n');
}

mapNameInput.addEventListener('input', updateSnippet);
shapeInput.addEventListener('change', updateSnippet);

document.getElementById('copyBtn').addEventListener('click', () => {
  snippetOut.select();
  document.execCommand('copy');
});
</script>
</body>
</html>
